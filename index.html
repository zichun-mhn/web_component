<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Token from Local Storage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .content {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h1>Stored Token Data</h1>
  <div class="content" id="jsonData">
    <!-- JSON data will be displayed here -->
  </div>

  <script>
    // Retrieve and display the data from localStorage
    function displayLocalStorageData() {
      const jsonData = localStorage.getItem('testKey');
      if (jsonData) {
        document.getElementById('jsonData').textContent = jsonData;
      } else {
        document.getElementById('jsonData').textContent = 'No data found in local storage.';
      }
    }

    // Call the function when the page loads
    window.onload = displayLocalStorageData;
  </script>

</body>
</html>
